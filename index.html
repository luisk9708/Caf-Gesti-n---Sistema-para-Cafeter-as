<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>CaféGestión - Sistema para Cafeterías</title>
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="icon" type="image/x-icon" href="assets/img/Logo.ico" />
</head>
<body>

    <!-- Encabezado principal -->
    <header style="text-align: center; padding-top: 20px;"> 
        <img src="assets/img/Logo.png" alt="Logo de CaféGestión" width="170" height="170">
        <h1>CaféGestión</h1>
        <p>Control de productos e inventario para tu cafetería</p>
    </header>

    <!-- Formulario para agregar o editar productos -->
    <section class="form-section">
        <h2>Agregar / Editar Producto</h2>
        <form id="product-form">
            <input type="hidden" id="product-id" />

            <label for="name">Nombre del producto:</label>
            <input type="text" id="name" placeholder="Ej: Capuchino" required />

            <label for="category">Categoría:</label>
            <select id="category" required>
                <option value="">Selecciona una categoría</option>
                <option value="Bebida caliente">Bebida caliente</option>
                <option value="Bebida fría">Bebida fría</option>
                <option value="Panadería">Panadería</option>
                <option value="Repostería">Repostería</option>
                <option value="Snack">Snack</option>
            </select>

            <label for="price">Precio ($):</label>
            <input type="number" id="price" min="0" step="0.01" placeholder="Ej: 8500" required />

            <label for="stock">Stock disponible:</label>
            <input type="number" id="stock" min="0" step="1" placeholder="Ej: 25" required />

            <label for="description">Descripción:</label>
            <textarea id="description" placeholder="Descripción breve del producto..."></textarea>

            <button type="submit">Guardar Producto</button>
        </form>
    </section>

    <!-- Sección de listado de productos -->
    <section class="table-section">
        <h2>Lista de Productos</h2>

        <div style="margin-bottom: 15px;">
            <label for="search">Buscar producto:</label>
            <input type="text" id="search" placeholder="Ej: capuchino, snack, etc." />
        </div>

        <table>
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Categoría</th>
                    <th>Precio</th>
                    <th>Stock</th>
                    <th>Descripción</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="product-table-body">
                <!-- Productos renderizados por JS -->
            </tbody>
        </table>
    </section>

    <!-- Scripts JS -->
    <script src="js/singletongaravito/productoManager.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
